[options]
isa rv32i
solver bmc3
mode bmc

[depth]
insn 12
reg 1 12
pc_fwd 1 12
pc_bwd 1 12
unique 1 1 12
cover 1 20

[defines]
`define PROOFCORE_RVFI
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@REPO_ROOT@/formal/harness/formal_memory.sv
@REPO_ROOT@/rtl/proofcore_pkg.sv
@REPO_ROOT@/rtl/alu.sv
@REPO_ROOT@/rtl/imm_gen.sv
@REPO_ROOT@/rtl/regfile.sv
@REPO_ROOT@/rtl/decoder.sv
@REPO_ROOT@/rtl/forwarding.sv
@REPO_ROOT@/rtl/hazard_unit.sv
@REPO_ROOT@/rtl/pipeline/if_id.sv
@REPO_ROOT@/rtl/pipeline/id_ex.sv
@REPO_ROOT@/rtl/pipeline/ex_mem.sv
@REPO_ROOT@/rtl/pipeline/mem_wb.sv
@REPO_ROOT@/rtl/core.sv

[cover]
always @* if (!reset) cover (rvfi_valid == 1'b1);
